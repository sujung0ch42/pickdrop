<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fcfaf7" />
    <title>PICKDROP — 고민은 넣고, 선택은 뽑고.</title>
    <style>
      :root {
        font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        color: #292929;
        background: #fcfaf7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .shell {
        max-width: 440px;
        min-height: 100dvh;
        margin: auto;
        background: #fff;
        box-shadow: 0 0 0 1px #eee;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 20px 18px;
        border-bottom: 1px solid #efede9;
      }
      .brand {
        font-weight: 900;
        letter-spacing: -1px;
        font-size: 22px;
      }
      .brand em {
        font-style: normal;
        color: #8a8a8a;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .link {
        background: transparent;
        border: 0;
        font-size: 13px;
        font-weight: 700;
        color: #292929;
      }
      .page {
        padding: 24px 20px 90px;
      }
      .heroTag {
        display: inline-block;
        font-size: 11px;
        border: 1px solid #292929;
        padding: 6px 12px;
        border-radius: 100px;
        font-weight: 800;
        letter-spacing: 1.3px;
      }
      .hero {
        font-size: 42px;
        line-height: 1.25;
        letter-spacing: -2.4px;
        margin: 22px 0 15px;
      }
      .sub {
        color: #858585;
        font-size: 13px;
        line-height: 1.7;
      }
      .machine,
      .dark {
        background: #292929;
        color: #fff;
        border-radius: 13px;
        padding: 15px;
      }
      .machine {
        margin: 29px 0 18px;
      }
      .machineTop {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 1px;
        margin-bottom: 13px;
      }
      .machineGrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .product {
        border: 0;
        text-align: left;
        background: #f8f7f5;
        padding: 17px 12px;
        border-radius: 6px;
        min-height: 130px;
        color: #292929;
      }
      .product strong {
        display: block;
        font-size: 21px;
        margin: 12px 0 3px;
      }
      .product small {
        font-size: 10px;
      }
      .slot {
        margin: 17px 32% 2px;
        height: 8px;
        background: #121212;
        border-radius: 10px;
      }
      .tile {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid #dedbd7;
        border-radius: 11px;
        background: #fff;
        padding: 18px 15px;
        margin: 10px 0;
        text-align: left;
        font-weight: 700;
      }
      .tile.active {
        background: #292929;
        color: #fff;
      }
      .tile small {
        font-size: 11px;
        color: #969696;
        font-weight: 400;
      }
      .arrow {
        border-radius: 50%;
        background: #eee;
        padding: 9px;
      }
      .stepTop {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .stepTop h1 {
        font-size: 22px;
        margin: 0;
      }
      .stepTop span {
        font-size: 13px;
        color: #999;
      }
      .progress {
        height: 4px;
        background: #eceae7;
        border-radius: 4px;
        overflow: hidden;
        margin: 14px 0 30px;
      }
      .progress div {
        height: 100%;
        background: #292929;
      }
      .field {
        margin: 19px 0 8px;
        display: block;
        font-size: 15px;
        font-weight: 800;
      }
      .input {
        width: 100%;
        border: 1px solid #c5c3c0;
        padding: 15px;
        border-radius: 11px;
        background: white;
        outline: none;
      }
      .input:focus {
        border-color: #292929;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }
      .chip {
        border: 1px solid #c9c6c1;
        border-radius: 30px;
        padding: 8px 13px;
        background: #fff;
        font-size: 12px;
      }
      .chip.selected {
        background: #292929;
        color: #fff;
      }
      .footer {
        display: flex;
        gap: 8px;
        margin-top: 28px;
      }
      .btn {
        width: 100%;
        padding: 16px 13px;
        background: #292929;
        color: #fff;
        border: 1px solid #292929;
        border-radius: 11px;
        font-weight: 800;
      }
      .btn.secondary {
        background: white;
        color: #292929;
      }
      .options {
        padding: 8px;
        border-radius: 11px;
        background: #292929;
        margin-top: 20px;
      }
      .opt {
        display: flex;
        background: #444;
        border-radius: 7px;
        gap: 8px;
        padding: 8px;
        margin-bottom: 8px;
        align-items: center;
      }
      .opt:last-child {
        margin-bottom: 0;
      }
      .opt input {
        min-width: 0;
        width: 100%;
        border: 0;
        padding: 14px;
        background: white;
        border-radius: 5px;
      }
      .opt .pic {
        background: #ddd;
        color: #555;
        padding: 13px;
        font-size: 22px;
        border-radius: 5px;
      }
      .opt button {
        background: none;
        border: 0;
        color: #fff;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border: 1px solid #ddd;
        padding: 14px;
        margin: 10px 0;
        border-radius: 10px;
      }
      .row strong {
        flex: 1;
      }
      .row small {
        color: #999;
      }
      .round {
        border: 1px solid #ddd;
        border-radius: 9px;
        background: #fff;
        padding: 7px 10px;
      }
      .score {
        display: flex;
        gap: 4px;
      }
      .score button {
        flex: 1;
        border: 1px solid #cfcfcf;
        border-radius: 7px;
        padding: 10px 0;
        background: white;
      }
      .score button.on {
        background: #292929;
        color: #fff;
      }
      .rating {
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 12px;
        margin: 14px 0;
      }
      .rating h3 {
        margin: 4px 0 12px;
      }
      .rating label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin: 12px 0 7px;
      }
      .winner {
        background: #292929;
        color: #fff;
        padding: 17px;
        border-radius: 12px;
      }
      .winner > div {
        background: white;
        color: #292929;
        border-radius: 7px;
        padding: 17px;
        margin-top: 9px;
      }
      .winner b {
        font-size: 25px;
      }
      .rank {
        display: flex;
        justify-content: space-between;
        background: #f5f4f2;
        border-radius: 8px;
        margin: 8px 0;
        padding: 12px;
      }
      .bar {
        height: 9px;
        background: #e7e6e4;
        border-radius: 9px;
        overflow: hidden;
        margin: 8px 0;
      }
      .bar span {
        height: 100%;
        background: #292929;
        display: block;
      }
      .hint {
        font-size: 12px;
        color: #888;
        line-height: 1.6;
      }
      .notice {
        background: #f3f1ed;
        border-radius: 8px;
        padding: 14px;
        font-size: 12px;
        line-height: 1.6;
        color: #777;
        margin: 15px 0;
      }
      .meta {
        margin: 25px 0 12px;
        font-size: 16px;
        font-weight: 800;
      }
      .voteopt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid #555;
        background: #444;
        color: white;
        border-radius: 7px;
        padding: 15px;
        margin: 8px 0;
        width: 100%;
        text-align: left;
      }
      .voteopt.active {
        border: 2px solid white;
      }
      .voteopt > span:last-child {
        border: 2px solid #eee;
        border-radius: 5px;
        width: 28px;
        height: 28px;
        text-align: center;
        line-height: 24px;
      }
      .empty {
        text-align: center;
        padding: 65px 10px;
        color: #666;
      }
      .history {
        padding: 14px 10px;
        border-bottom: 1px solid #ddd;
      }
      .history b {
        display: block;
      }
      .history small {
        color: #999;
      }
      .msg {
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-top: 10px;
      }
      .subhead {
        font-size: 17px;
        font-weight: 800;
        margin: 22px 0 10px;
      }
      .footerTxt {
        font-size: 10px;
        text-align: center;
        color: #aaa;
        padding: 25px 0;
        letter-spacing: 1px;
      }
      @media (min-width: 700px) {
        body {
          background: #f1efeb;
          padding: 25px 0;
        }
      }

      :root {
        font-family:
          "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      .shell {
        background: #fffefd;
      }
      .page {
        overflow-wrap: anywhere;
      }
      .sub,
      .hint,
      .notice {
        color: #686868;
      }
      #status:not(:empty) {
        margin: 12px 20px 0;
        padding: 12px 14px;
        border: 1px solid #dedbd7;
        border-radius: 8px;
        background: #f4f2ee;
        font-size: 14px;
      }
      #status:empty {
        display: none;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #595959;
        outline-offset: 2px;
      }
      .tile {
        gap: 8px;
      }
      .tile small {
        flex-shrink: 0;
        max-width: 42%;
        text-align: right;
        color: #6c6c6c;
      }
      .tile.active small {
        color: #ddd;
      }
      .footer .btn {
        min-width: 0;
      }
      .page > .btn + .btn {
        margin-top: 8px;
      }
      .rank b {
        white-space: nowrap;
      }
      .voteopt {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px;
        gap: 8px;
        padding: 8px;
        border: 0;
        background: #393939;
        color: #292929;
      }
      .voteopt.active {
        border: 0;
      }
      .voteopt > b {
        display: flex;
        align-items: center;
        min-height: 48px;
        padding: 12px 14px;
        background: #fffefd;
        border-radius: 4px;
      }
      .voteopt > span:last-child {
        display: grid;
        place-items: center;
        width: auto;
        height: auto;
        min-height: 48px;
        background: #fffefd;
        border: 8px solid #484848;
        border-radius: 6px;
        color: #292929;
      }
      .voteopt.active > span:last-child {
        background: #292929;
        color: white;
        box-shadow: inset 0 0 0 2px #fffefd;
        font-size: 22px;
      }
      .dark {
        padding: 12px 8px;
        border-radius: 10px;
      }
      .dark > b {
        display: block;
        padding: 0 8px 4px;
      }
      .dark .voteopt:last-child {
        margin-bottom: 0;
      }
      .dark .voteopt:first-child {
        margin-top: 0;
      }
      .guest-page .top,
      .guest-page .footerTxt {
        display: none;
      }
      .guest-page .page {
        padding-bottom: 24px;
      }
      .guestVote .stepTop h1 {
        font-size: 18px;
      }
      .guestVote h2 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      .guestVote .stepTop small {
        border: 1px solid #b8b8b4;
        border-radius: 20px;
        padding: 3px 11px;
        background: #f4f2ee;
      }
      .guestVote .voteopt > b,
      .guestVote .voteopt > span {
        min-height: 64px;
      }
      .guestVote .field {
        font-size: 13px;
        font-weight: 500;
        color: #686868;
      }
      .guestVote .field small {
        float: right;
      }
      .guestVote .input {
        background: #fffefd;
      }
      .toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .toggle input {
        width: 22px;
        height: 22px;
        accent-color: #292929;
      }
      .tie > strong {
        float: right;
        font-size: 13px;
      }
      .tie > .tieCards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        background: none;
        padding: 0;
      }
      .tieCards article {
        border-radius: 8px;
        background: #fffefd;
        padding: 12px;
      }
      .tieCards article b {
        font-size: 16px;
      }
      .tieCards p {
        margin: 8px 0 0;
      }
      @media (max-width: 360px) {
        .hero {
          font-size: 36px;
        }
        .page,
        .top {
          padding-inline: 16px;
        }
        .voteopt {
          grid-template-columns: minmax(0, 1fr) 56px;
        }
        .tile {
          flex-wrap: wrap;
        }
      }

      .presetHeading {
        font-size: 18px;
        margin: 14px 0 12px;
      }
      .preset {
        border: 1px solid #b8b8b4;
        border-radius: 12px;
        overflow: hidden;
        margin: 8px 0;
        background: #fffefd;
      }
      .preset.active {
        background: #292929;
        color: #fff;
      }
      .presetButton {
        width: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        display: flex;
        text-align: left;
        align-items: center;
        gap: 10px;
        padding: 14px 12px;
      }
      .presetButton > span {
        min-width: 52px;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        border: 1px solid #292929;
        border-radius: 6px;
        background: #f4f2ee;
        color: #292929;
        padding: 5px 6px;
      }
      .presetButton > small {
        margin-left: auto;
        font-size: 11px;
        color: #686868;
        text-align: right;
      }
      .presetCriteria {
        padding: 0 12px 14px;
      }
      .presetCriteria p {
        margin: 0;
        font-size: 12px;
        color: #ddd;
      }
      .presetCriteria .chip {
        background: transparent;
        color: #fff;
        border-style: dashed;
        padding: 7px 10px;
      }
      .presetCriteria .chip.selected {
        background: #fffefd;
        color: #292929;
        border-style: solid;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <button class="link brand" data-act="home">PICK<em>DROP</em></button
        ><button class="link" id="authbutton" data-act="account">
          로그인 ↗
        </button>
      </header>
      <div id="status" role="status" aria-live="polite"></div>
      <main id="page" class="page"></main>
      <div class="footerTxt">MAKE A CHOICE, DROP THE DOUBT · PICKDROP</div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"
      defer
    ></script>
    <script defer src="/app.js"></script>
  </body>
</html>
