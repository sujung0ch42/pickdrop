<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fcfaf7" />
    <title>PICKDROP — 고민은 넣고, 선택은 뽑고</title>
    <link rel="stylesheet" href="/styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"
      defer
    ></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main id="page" class="page"></main>
    <div id="status" role="status" aria-live="polite" hidden>
      <span></span
      ><button type="button" aria-label="알림 닫기">
        <img src="/assets/imgIconClose.svg" alt="" />
      </button>
    </div>
    <dialog aria-label="입력 팝업"></dialog>
    <dialog id="photo-sheet" aria-label="사진 선택">
      <label class="photo-input"
        >사진 찍기<input type="file" accept="image/*" capture="environment"
      /></label>
      <label class="photo-input"
        >사진 보관함<input type="file" accept="image/*"
      /></label>
      <button type="button" data-act="close-photo-sheet">취소</button>
    </dialog>
  </body>
</html>
